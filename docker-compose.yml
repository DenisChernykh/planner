x-runtime-image: &runtime-image
  image: planner:local
  build:
    context: .
    target: runtime

x-database-url: &database-url postgresql://planner:local-development-only@postgres:5432/planner?schema=public
x-redis-auth-url: &redis-auth-url redis://default:local-development-only@redis-auth:6379

services:
  postgres:
    image: postgres:18.4-trixie@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    environment:
      POSTGRES_DB: planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: local-development-only
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U planner -d planner']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis-auth:
    image: redis:8.8.0-trixie@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b
    command:
      - redis-server
      - --requirepass
      - local-development-only
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: local-development-only
    ports:
      - '127.0.0.1:${REDIS_AUTH_PORT:-6379}:6379'
    volumes:
      - redis-auth-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrator:
    <<: *runtime-image
    command: ['pnpm', 'start:migrate']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *runtime-image
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: *database-url
      REDIS_AUTH_URL: *redis-auth-url
      REDIS_KEY_PREFIX: planner
      AUTH_SESSION_KEY_SECRET: MzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzM
      AUTH_CSRF_SECRET: NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ
      AUTH_OIDC_STATE_KEY_SECRET: NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU
      AUTH_CSRF_ORIGINS: http://127.0.0.1:${API_PORT:-3000}
      TELEGRAM_OIDC_CLIENT_ID: '123456789'
      TELEGRAM_OIDC_CLIENT_SECRET: planner-local-telegram-client-secret
      TELEGRAM_OIDC_CALLBACK_URL: http://127.0.0.1:${API_PORT:-3000}/auth/telegram/callback
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis-auth:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  planner-worker:
    <<: *runtime-image
    command: ['pnpm', 'start:planner-worker']
    environment:
      DATABASE_URL: *database-url
      PLANNER_WORKER_INTERVAL_MS: 30000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN for planner-worker}
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  redis-auth-data:
